<!doctype html>
<html lang="en-PH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PeraPilot — Take control of your money</title>
  <meta name="description" content="PeraPilot is a personal finance app built around your actual payday and cut-off.">
  <meta name="theme-color" content="#0b2447">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app" hidden>
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/" aria-label="PeraPilot home">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 3l11 24-11-5-11 5L16 3z" fill="currentColor"/></svg></span>
        <span class="brand-text"><b>PeraPilot</b><small>Take control of your money.</small></span>
      </a>
      <nav id="nav-main"></nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <a class="brand brand-sm" href="#/" aria-label="PeraPilot home">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 3l11 24-11-5-11 5L16 3z" fill="currentColor"/></svg></span>
          <b>PeraPilot</b>
        </a>
        <h1 id="page-title" class="page-title">Dashboard</h1>
        <div class="topbar-actions">
          <button type="button" class="btn ghost sm hide-sm" data-act="record-salary">Record salary</button>
          <button type="button" class="btn primary sm" data-act="add-tx"><span class="plus">+</span><span class="hide-xs"> Add transaction</span></button>
        </div>
      </header>
      <div id="banners"></div>
      <main id="view" class="view" tabindex="-1"></main>
    </div>

    <nav class="bottom-nav" id="bottom-nav" aria-label="Quick navigation"></nav>
  </div>

  <div id="loading" class="loading"><div class="spinner"></div><p>Opening PeraPilot…</p></div>
  <noscript><p style="padding:24px;font-family:sans-serif">PeraPilot needs JavaScript to run.</p></noscript>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script src="js/logic.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/db.js"></script>
  <script src="js/ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
